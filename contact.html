<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | AW_GEMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;600&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'royal-gold': '#D4AF37',
                        'royal-dark': '#0B0F19',
                        'royal-blue': '#1E293B',
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-royal-dark text-white font-sans antialiased selection:bg-royal-gold selection:text-royal-dark">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-royal-dark/90 backdrop-blur-md border-b border-white/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex-shrink-0">
                    <a href="index.html"
                        class="font-serif text-3xl font-bold text-royal-gold tracking-widest hover:opacity-80 transition">AW_GEMS</a>
                </div>
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8">
                        <a href="index.html"
                            class="text-white hover:text-royal-gold px-3 py-2 rounded-md text-sm font-medium transition duration-300">Home</a>
                        <a href="collection.html"
                            class="text-white/80 hover:text-royal-gold px-3 py-2 rounded-md text-sm font-medium transition duration-300">Collection</a>
                        <a href="about.html"
                            class="text-white/80 hover:text-royal-gold px-3 py-2 rounded-md text-sm font-medium transition duration-300">Our
                            Story</a>
                        <a href="contact.html"
                            class="bg-royal-gold text-royal-dark hover:bg-white px-6 py-2 rounded-full text-sm font-bold transition duration-300 transform hover:-translate-y-0.5">Contact
                            Us</a>
                    </div>
                </div>
                <!-- Mobile menu button -->
                <div class="-mr-2 flex md:hidden">
                    <button type="button" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')"
                        class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-white">
                        <span class="sr-only">Open main menu</span>
                        <svg class="block h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <!-- Mobile Menu -->
        <div class="hidden md:hidden bg-royal-dark border-t border-white/10" id="mobile-menu">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="index.html" class="text-royal-gold block px-3 py-2 rounded-md text-base font-medium">Home</a>
                <a href="collection.html"
                    class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Collection</a>
                <a href="about.html"
                    class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Our
                    Story</a>
                <a href="contact.html"
                    class="text-gray-300 hover:text-white block px-3 py-2 rounded-md text-base font-medium">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="pt-40 pb-10 text-center">
        <h1 class="font-serif text-5xl md:text-6xl text-white font-bold mb-6">Get in Touch</h1>
        <p class="text-gray-400">We would love to hear from you. Visit our showroom or send us a message.</p>
    </div>

    <!-- Contact Section -->
    <div class="py-16 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="grid md:grid-cols-2 gap-16">

            <!-- Form -->
            <div class="bg-gray-900/50 p-8 rounded-2xl border border-white/5 backdrop-blur-sm">
                <form action="#" class="space-y-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-400 mb-2">Full Name</label>
                        <input type="text" id="name"
                            class="w-full bg-black/40 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-royal-gold focus:ring-1 focus:ring-royal-gold transition"
                            placeholder="John Doe">
                    </div>
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-400 mb-2">Email Address</label>
                        <input type="email" id="email"
                            class="w-full bg-black/40 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-royal-gold focus:ring-1 focus:ring-royal-gold transition"
                            placeholder="john@example.com">
                    </div>
                    <div>
                        <label for="subject" class="block text-sm font-medium text-gray-400 mb-2">Inquiry Type</label>
                        <select id="subject"
                            class="w-full bg-black/40 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-royal-gold focus:ring-1 focus:ring-royal-gold transition">
                            <option>General Inquiry</option>
                            <option>Custom Design</option>
                            <option>Purchase Request</option>
                            <option>Appointment Booking</option>
                        </select>
                    </div>
                    <div>
                        <label for="message" class="block text-sm font-medium text-gray-400 mb-2">Message</label>
                        <textarea id="message" rows="4"
                            class="w-full bg-black/40 border border-gray-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-royal-gold focus:ring-1 focus:ring-royal-gold transition"
                            placeholder="How can we help you?"></textarea>
                    </div>
                    <button type="button"
                        class="w-full bg-royal-gold text-royal-dark font-bold py-4 rounded-lg hover:bg-white transition duration-300 transform hover:-translate-y-1">Send
                        Message</button>
                </form>
            </div>

            <!-- Info -->
            <div class="space-y-12 flex flex-col justify-center">

                <div>
                    <h3 class="font-serif text-2xl text-white mb-6">Visit Our Showroom</h3>
                    <div class="space-y-4 text-gray-400">
                        <p class="flex items-start gap-4">
                            <span class="text-royal-gold mt-1"><svg class="w-5 h-5" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z">
                                    </path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg></span>
                            <span>
                                No. 45, Rampart Street,<br>
                                Galle Fort, Sri Lanka
                            </span>
                        </p>
                        <p class="flex items-center gap-4">
                            <span class="text-royal-gold"><svg class="w-5 h-5" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z">
                                    </path>
                                </svg></span>
                            <span>+94 77 123 4567</span>
                        </p>
                        <p class="flex items-center gap-4">
                            <span class="text-royal-gold"><svg class="w-5 h-5" fill="none" stroke="currentColor"
                                    viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                                    </path>
                                </svg></span>
                            <span>info@awgems.com</span>
                        </p>
                    </div>
                </div>

                <div
                    class="h-64 w-full rounded-xl overflow-hidden border border-gray-700 shadow-[0_0_15px_rgba(212,175,55,0.1)]">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15871.30907106037!2d80.2117267554199!3d6.027221399999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3ae173a6a96414fd%3A0x6b772bc852778!2sGalle%20Fort%2C%20Galle!5e0!3m2!1sen!2slk!4v1707000000000!5m2!1sen!2slk"
                        width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="no-referrer-when-downgrade"
                        class="grayscale hover:grayscale-0 transition duration-500"></iframe>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
